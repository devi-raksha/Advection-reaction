name: Build and deploy docs

on:
  push:
    branches: [documentation, main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Create venv and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          . .venv/bin/activate
          pip install -r doc/requirements.txt

      - name: Build site
        run: |
          . .venv/bin/activate
          echo "Repository root listing:" && ls -la
          echo "Scripts listing:" && ls -la ./scripts || true
          echo "Running build script with bash"
          bash ./scripts/build_doc.sh
        env:
          STRICT_DOCS: "1"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/docs/site
          publish_branch: gh-pages
